[project]
name = "graph-builder-spec"
version = "0.3.0"
description = "A declaration layer over Pydantic Graph Builder."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic-graph>=2.0",
    "pydantic>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/borisdev/graph-builder-spec"
Source = "https://github.com/borisdev/graph-builder-spec"

[project.optional-dependencies]
evals = ["pydantic-evals>=2.0"]
# The browser dev tool. Optional: the library never imports it.
dev-server = ["fastapi>=0.110", "uvicorn>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pydantic-evals>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_builder_spec"]
# The built island ships IN the wheel — `pip install` runs no node step.
artifacts = ["graph_builder_spec/static/*"]
